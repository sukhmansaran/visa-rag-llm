name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: visa_chatbot_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visa_chatbot_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@localhost:5432/visa_chatbot_ci_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@localhost:5432/visa_chatbot_ci_test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@localhost:5432/visa_chatbot_migration_test
      ALEMBIC_PREVENT_DEV_MUTATION: "1"
      DATABASE_AUTO_CREATE_TABLES: "0"
      SECRET_KEY: ci-test-secret-key-32-chars-minimum-length-for-testing
      ENVIRONMENT: testing
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e5eda7314ea5167664188561d31a55546 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code hygiene checks (flake8 syntax gate)
        run: |
          flake8 app alembic tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify model registration and imports
        run: |
          python -c "import app.models; from app.core.database import DISPOSABLE_DATABASE_ALLOWLIST; print(f'Models registered successfully. Allowlist: {sorted(DISPOSABLE_DATABASE_ALLOWLIST)}')"

      - name: Validate database isolation & provision disposable databases
        run: |
          python -c "
          import os, sys
          from urllib.parse import urlparse
          import psycopg2
          from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT

          from app.core.database import DISPOSABLE_DATABASE_ALLOWLIST

          expected_targets = {
              'DATABASE_URL': {
                  'scheme': 'postgresql+asyncpg',
                  'user': 'postgres',
                  'host': 'localhost',
                  'port': 5432,
                  'dbname': 'visa_chatbot_ci_test'
              },
              'TEST_DATABASE_URL': {
                  'scheme': 'postgresql+asyncpg',
                  'user': 'postgres',
                  'host': 'localhost',
                  'port': 5432,
                  'dbname': 'visa_chatbot_ci_test'
              },
              'ALEMBIC_DATABASE_URL': {
                  'scheme': 'postgresql+asyncpg',
                  'user': 'postgres',
                  'host': 'localhost',
                  'port': 5432,
                  'dbname': 'visa_chatbot_migration_test'
              }
          }

          forbidden_dbs = {'visa_chatbot', 'visa_chatbot_dev'}

          for var_name, expected in expected_targets.items():
              raw_val = os.getenv(var_name)
              if not raw_val:
                  sys.exit(f'FAIL-CLOSED: {var_name} is missing or empty.')

              clean_scheme = raw_val.split('://')[0] if '://' in raw_val else ''
              if clean_scheme != expected['scheme']:
                  sys.exit(f'FAIL-CLOSED: {var_name} scheme is \"{clean_scheme}\", expected \"{expected[\"scheme\"]}\"')

              std_url = raw_val.replace('+asyncpg', '')
              try:
                  parsed = urlparse(std_url)
              except Exception as err:
                  sys.exit(f'FAIL-CLOSED: {var_name} is malformed: {err}')

              if parsed.username != expected['user']:
                  sys.exit(f'FAIL-CLOSED: {var_name} username is \"{parsed.username}\", expected \"{expected[\"user\"]}\"')

              if parsed.hostname not in (expected['host'], '127.0.0.1'):
                  sys.exit(f'FAIL-CLOSED: {var_name} host is \"{parsed.hostname}\", expected \"{expected[\"host\"]}\"')

              if parsed.port != expected['port']:
                  sys.exit(f'FAIL-CLOSED: {var_name} port is {parsed.port}, expected {expected[\"port\"]}')

              dbname = (parsed.path or '').lstrip('/')
              if not dbname:
                  sys.exit(f'FAIL-CLOSED: {var_name} does not specify a database name.')

              if dbname in forbidden_dbs:
                  sys.exit(f'FAIL-CLOSED: {var_name} points to protected development database \"{dbname}\"!')

              if dbname not in DISPOSABLE_DATABASE_ALLOWLIST:
                  sys.exit(f'FAIL-CLOSED: {var_name} database \"{dbname}\" is not in DISPOSABLE_DATABASE_ALLOWLIST!')

              if dbname != expected['dbname']:
                  sys.exit(f'FAIL-CLOSED: {var_name} database name is \"{dbname}\", expected strictly \"{expected[\"dbname\"]}\"')

          print('Preflight validation passed: scheme, username, hostname, port, and allowlist strictly verified.')

          # Connect to default maintenance database to manage disposable databases
          conn = psycopg2.connect(
              dbname='postgres',
              user='postgres',
              password='postgres_password',
              host='localhost',
              port=5432
          )
          conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
          with conn.cursor() as cur:
              # Ensure visa_chatbot_migration_test exists
              cur.execute(\"SELECT 1 FROM pg_database WHERE datname = 'visa_chatbot_migration_test'\")
              if not cur.fetchone():
                  cur.execute(\"CREATE DATABASE visa_chatbot_migration_test\")

              # Ensure visa_chatbot_disposable_migration_test exists
              cur.execute(\"SELECT 1 FROM pg_database WHERE datname = 'visa_chatbot_disposable_migration_test'\")
              if not cur.fetchone():
                  cur.execute(\"CREATE DATABASE visa_chatbot_disposable_migration_test\")

              # Confirm protected dev databases strictly DO NOT exist on CI runner
              cur.execute(\"SELECT datname FROM pg_database WHERE datname IN ('visa_chatbot', 'visa_chatbot_dev')\")
              found_dev = [r[0] for r in cur.fetchall()]
              if found_dev:
                  sys.exit(f'FAIL-CLOSED: Protected database {found_dev} unexpectedly found on CI runner!')
          conn.close()
          print('Disposable test databases provisioned and absence of dev databases confirmed.')
          "

      - name: Run pytest test suite
        run: |
          pytest -v --tb=short

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm 9.15.9
        uses: pnpm/action-setup@a3252b78447368d3750d40fa11075ba3ea022416 # v4.0.0
        with:
          version: 9.15.9

      - name: Set up Node.js 20
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm run lint

      - name: Run frontend production build
        run: pnpm run build
