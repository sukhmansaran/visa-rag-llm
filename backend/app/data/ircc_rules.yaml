post_graduation_work_permit:
  rule_id: "IRCC-PGWP-2024-REFORM"
  title: "Post-Graduation Work Permit (PGWP) Eligibility and Language Standards"
  effective_from: "2024-11-01"
  last_verified: "2026-10-12"
  verified_by: "Language (CLB 7 university / CLB 5 college) and field-of-study rules checked against canada.ca on 2026-10-12; duration_rules not shown on that page and not re-verified"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/after-graduation/eligibility.html"
  statutory_basis: "IRCC Operational Instructions for the Post-Graduation Work Permit Program"
  automatic_eligibility: false
  language_requirements:
    university_graduates_clb: 7
    college_graduates_clb: 5
    accepted_tests: ["IELTS General", "CELPIP General", "PTE Core", "TEF Canada", "TCF Canada"]
  field_of_study_requirements:
    university_degrees: "Eligible in all fields of study (Bachelor's, Master's, Doctoral)"
    college_diplomas: "Must graduate from a designated program linked to long-term labour shortages (Agriculture and Agri-Food, Healthcare, STEM, Trade, Transport)"
  duration_rules:
    programs_under_8_months: 0
    masters_degrees_8_months_or_more: 36
    general_programs_2_years_or_more: 36
    general_programs_under_2_years: "Equal to program length"
  application_window_days: 180

provincial_attestation_letter:
  rule_id: "IRCC-PAL-2026"
  title: "Provincial/Territorial Attestation Letter (PAL/TAL) Requirement"
  effective_from: "2026-01-01"
  last_verified: "2026-10-12"
  verified_by: "Checked against the canada.ca PAL page on 2026-10-12"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/get-documents/provincial-attestation-letter.html"
  statutory_basis: "Ministerial Instructions respecting the Student Intake Cap under IRPA s. 10.1"
  undergraduate_diploma_required: true
  # From 2026-01-01: degree-granting master's/doctoral programs at a PUBLIC DLI are exempt
  masters_doctoral_public_dli_exempt_from: "2026-01-01"
  masters_doctoral_private_dli_required: true
  exemptions:
    k12_preschool_primary_secondary: true
    masters_doctoral_at_public_dli_from_2026_01_01: true
    in_canada_study_permit_extension_same_dli_and_level: true
    exchange_students_paying_no_tuition_to_dli: true
    global_affairs_canada_scholarship: true
    federally_designated_military_college: true
    francophone_minority_communities_student_pilot: true
  exempt_applicants_must_show_proof_of_exemption: true

