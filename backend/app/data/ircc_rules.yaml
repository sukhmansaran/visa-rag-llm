student_direct_stream:
  rule_id: "IRCC-SDS-SUNSET-2024"
  title: "Student Direct Stream (SDS) Termination"
  effective_from: "2024-11-08"
  last_verified: "2026-10-19"
  verified_by: "Checked against the IRCC notice (source_url) by an AI assistant on 2026-10-15 and 2026-10-19 (cut-off '2:00 p.m. ET on November 8, 2024' quoted); not yet checked by a person"
  # The former SDS program page no longer mentions SDS; the closure notice is the authoritative source.
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/news/notices/end-student-direct-stream-nigeria-student-express.html"
  is_active: false
  status: "TERMINATED"
  termination_notice: "IRCC ended the Student Direct Stream (SDS) and Nigeria Student Express (NSE) as of 2:00 p.m. ET on November 8, 2024. Eligible SDS and NSE applications received before then are processed under those streams; everyone else applies through the regular study permit stream."

post_graduation_work_permit:
  rule_id: "IRCC-PGWP-2024-REFORM"
  title: "Post-Graduation Work Permit (PGWP) Eligibility and Language Standards"
  effective_from: "2024-11-01"
  last_verified: "2026-10-19"
  verified_by: "Language and field-of-study rules checked against canada.ca on 2026-10-12; duration (about.html), 180-day window (eligibility.html) and working while waiting (apply.html) checked by an AI assistant on 2026-10-19; not yet checked by a person"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/after-graduation/eligibility.html"
  duration_source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/after-graduation/about.html"
  statutory_basis: "IRCC Operational Instructions for the Post-Graduation Work Permit Program"
  automatic_eligibility: false
  language_requirements:
    # Applies to PGWP applications submitted on or after 2024-11-01; all 4 abilities
    applies_to_pgwp_applications_from: "2024-11-01"
    university_graduates_clb: 7        # bachelor's, master's, doctoral and other university programs
    college_graduates_clb: 5           # college, polytechnic or other non-university programs
    accepted_tests: ["IELTS General", "CELPIP General", "PTE Core", "TEF Canada", "TCF Canada"]
  field_of_study_requirements:
    university_degrees: "No field of study requirement for bachelor's, master's or doctoral degrees"
    # Only if the STUDY PERMIT application was submitted on or after 2024-11-01
    applies_to_study_permit_applications_from: "2024-11-01"
    other_programs: "Other university programs and college/non-university programs: must graduate in an eligible field of study linked to occupations in long-term shortage"
  duration_rules:
    # "We may give you" (about.html): the officer decides; never longer than the passport's validity
    programs_under_8_months: 0
    masters_degrees_8_months_or_more: 36   # master's programs, as of 2024-02-15
    general_programs_2_years_or_more: 36
    general_programs_under_2_years: "Up to the length of the study program (programs of at least 8 months)"
    limited_by_passport_expiry: true
  application_window_days: 180            # from confirmation of program completion
  study_permit_valid_during_window_required: true   # valid at some point during those 180 days
  # apply.html: "You can't work until your work permit has been approved", unless the study permit was valid when
  # the PGWP application was submitted AND the other conditions for working while waiting are met
  work_while_waiting_requires_valid_study_permit_at_submission: true
  work_while_waiting_source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/after-graduation/apply.html"

provincial_attestation_letter:
  rule_id: "IRCC-PAL-2026"
  title: "Provincial/Territorial Attestation Letter (PAL/TAL) Requirement"
  effective_from: "2026-01-01"
  last_verified: "2026-10-12"
  verified_by: "Checked against the canada.ca PAL page on 2026-10-12"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/get-documents/provincial-attestation-letter.html"
  statutory_basis: "Ministerial Instructions respecting the Student Intake Cap under IRPA s. 10.1"
  undergraduate_diploma_required: true
  # From 2026-01-01: degree-granting master's/doctoral programs at a PUBLIC DLI are exempt
  masters_doctoral_public_dli_exempt_from: "2026-01-01"
  masters_doctoral_private_dli_required: true
  exemptions:
    k12_preschool_primary_secondary: true
    masters_doctoral_at_public_dli_from_2026_01_01: true
    in_canada_study_permit_extension_same_dli_and_level: true
    exchange_students_paying_no_tuition_to_dli: true
    global_affairs_canada_scholarship: true
    federally_designated_military_college: true
    francophone_minority_communities_student_pilot: true
  exempt_applicants_must_show_proof_of_exemption: true

express_entry_stem:
  rule_id: "IRCC-EE-STEM-2023-2026"
  title: "Express Entry Federal Skilled Worker & STEM Category-Based Selection"
  effective_from: "2023-06-28"
  last_verified: "2026-10-19"
  verified_by: "FSW facts checked against federal-skilled-workers.html and the STEM category against category-based-selection.html by an AI assistant on 2026-10-19; not yet checked by a person"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/rounds-invitations/category-based-selection.html"
  fsw_source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/who-can-apply/federal-skilled-workers.html"
  statutory_basis: "Immigration and Refugee Protection Act (IRPA) Category-Based Selection Provisions"
  # Federal Skilled Worker Program
  fsw_minimum_work_experience_years: 1          # continuous, paid, or 1,560 hours; within the last 10 years
  fsw_work_experience_window_years: 10
  fsw_eligible_teer_categories: [0, 1, 2, 3]
  fsw_minimum_clb_all_bands: 7
  fsw_selection_grid_pass_points: 67            # out of 100
  # express-entry/documents/language-test.html: "Your test results must be less than 2 years old when you: complete
  # your Express Entry profile, and submit your application for permanent residence"
  language_results_max_age_years: 2
  fsw_education: "a completed educational credential (a foreign credential needs an Educational Credential Assessment, ECA)"
  # STEM category (one of 10 current categories). Corrected 2026-10-19: the previous list (software engineers 21231,
  # software developers 21232, computer engineers 21311, data scientists 21211, web developers 21233) is NOT on the
  # current STEM list; answers claimed software engineers qualify for STEM draws.
  stem_category:
    experience: "at least 12 months of full-time work experience (or equal part-time) within the past 3 years, in a single listed occupation, in Canada or abroad"
    occupations:
      "20011": "Architecture and science managers"
      "21220": "Cybersecurity specialists"
      "21300": "Civil engineers"
      "21301": "Mechanical engineers"
      "21310": "Electrical and electronics engineers"
      "21321": "Industrial and manufacturing engineers"
      "21331": "Geological engineers"
      "22300": "Civil engineering technologists and technicians"
      "22301": "Mechanical engineering technologists and technicians"
      "22310": "Electrical and electronics engineering technologists and technicians"
      "63100": "Insurance agents and brokers"

visitor_visa:
  rule_id: "IRCC-TRV-STANDARD"
  title: "Temporary Resident Visa (TRV) and Electronic Travel Authorization (eTA)"
  effective_from: "2024-01-01"
  last_verified: "2026-10-19"
  verified_by: "Checked against about-visitor-visa.html, visit-canada/eligibility.html and study-without-permit.html by an AI assistant on 2026-10-19; not yet checked by a person"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/visit-canada/about-visitor-visa.html"
  statutory_basis: "Immigration and Refugee Protection Regulations (IRPR) Part 9"
  maximum_authorized_stay_months: 6      # "Most visitors"; the border officer may allow less or more
  # Visitor status gives no right to work; some activities are exempt (work-canada/work-without-permit.html)
  unauthorized_to_work: true
  work_without_permit_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/work-canada/work-without-permit.html"
  # Corrected 2026-10-19 (was unauthorized_to_study_fulltime): "You don't need a study permit if you're coming to
  # Canada for a program that lasts 6 months or less"; longer programs need a study permit.
  study_without_permit_max_months: 6
  study_without_permit_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/eligibility/study-without-permit.html"
  eligibility_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/visit-canada/eligibility.html"

processing_times:
  rule_id: "IRCC-PROCESSING-TIMES-LIVE"
  title: "Application processing times (live, not stored)"
  effective_from: "2026-10-12"
  last_verified: "2026-10-12"
  verified_by: "Checked the canada.ca processing-times tool page on 2026-10-12 ('Our processing times are updated regularly')"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/application/check-processing-times.html"
  # Pendu deliberately stores no processing-time figures: they change regularly and vary by
  # application type and country/visa office, so any stored number would quickly be wrong.
  stores_figures: false


biometrics:
  rule_id: "IRCC-BIOMETRICS"
  title: "Biometrics (fingerprints and photo): who gives them and how long they are valid"
  effective_from: "2019-12-03"
  last_verified: "2026-10-20"
  verified_by: "Checked against who-needs-to-give.html, when-to-give-temporary-residence.html and express-entry/after-apply.html by an AI assistant on 2026-10-20; not yet checked by a person"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/biometrics/who-needs-to-give.html"
  validity_source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/biometrics/when-to-give-temporary-residence.html"
  permanent_residence_source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/after-apply.html"
  # Added in hardening 3: answers said biometrics are valid "5 years" and that children "under 18" are exempt.
  # "Your biometrics are valid for 10 years." (temporary residence)
  validity_years: 10
  # "We can't issue a visa or permit more than 10 years from the last time you gave your biometrics."
  permit_cannot_outlast_biometrics: true
  # "You don't need to give your biometrics if you're ... a child under the age of 14 ... an applicant over the
  # age of 79 ... There is no upper age exemption for asylum claimants."
  exempt_under_age: 14
  exempt_over_age: 79
  asylum_claimants_upper_age_exemption: false
  # "If you're between 14 and 79 years old, you need to give your ... biometrics for every permanent residence
  # application you submit ... even if you gave your biometrics in the past and they're still valid."
  permanent_residence_requires_new_biometrics_each_application: true
  # "If you're visiting from visa-exempt country, you're exempt from giving biometrics when you apply to extend
  # your stay." / "a visa-exempt national coming to Canada to visit only"
  visa_exempt_visitors_exempt: true
  # Fees (biometrics.html): "Individual applicant: CAN$85" / "Families applying at the same time: maximum total
  # fee of CAN$170" / "Groups of 3 or more performing artists ... maximum total fee of CAN$255" / "There is no fee
  # to give biometrics for a transit visa."
  fees_source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/biometrics.html"
  fee_individual_cad: 85
  fee_family_max_cad: 170
  fee_performing_artist_group_max_cad: 255
  fee_transit_visa_cad: 0
