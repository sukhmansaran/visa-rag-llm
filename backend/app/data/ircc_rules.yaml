proof_of_funds:
  rule_id: "IRCC-POF-SCHEDULES"
  title: "Minimum Living Funds for Study Permit Applicants (Outside Quebec, excluding tuition and transportation)"
  # effective_from of the CURRENT schedule (the section-level fields describe the schedule in force today)
  effective_from: "2026-09-01"
  last_verified: "2026-10-19"
  verified_by: "Outside-Quebec schedules checked against the canada.ca financial-support page on 2026-10-12; Quebec amounts corrected from quebec.ca and the 2024 single amount checked against IRCC's 2023-12-07 news release by an AI assistant on 2026-10-19; not yet checked by a person"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/get-documents/financial-support.html"
  statutory_basis: "75% of Statistics Canada Low-Income Cut-Off (LICO)"
  currency: "CAD"
  # Applications are assessed against the schedule in force on the application date.
  # Ordered newest first. effective_to is inclusive; null = still in force.
  schedules:
    - effective_from: "2026-09-01"
      effective_to: null
      verified: true
      rates_by_family_size: {1: 23448, 2: 29192, 3: 35888, 4: 43572, 5: 49419, 6: 55736, 7: 62054}
      additional_family_member_cad: 6318
    - effective_from: "2025-01-01"
      effective_to: "2026-08-31"
      verified: true
      rates_by_family_size: {1: 22895, 2: 28502, 3: 35040, 4: 42543, 5: 48252, 6: 54420, 7: 60589}
      additional_family_member_cad: 6170
    - effective_from: "2024-01-01"
      effective_to: "2024-12-31"
      # Single applicant ($20,635) confirmed 2026-10-19 in IRCC's news release of 2023-12-07
      # (news/2023/12/revised-requirements-to-better-protect-international-students.html). The release does not
      # publish the family-size amounts and canada.ca no longer shows this schedule, so they stay unverified.
      verified: false
      rates_by_family_size: {1: 20635, 2: 25690, 3: 31583, 4: 38346, 5: 43492, 6: 49051, 7: 54611}
      additional_family_member_cad: 5559
  quebec_guidelines:
    # Quebec sets its own amounts (canada.ca defers to Quebec). Checked 2026-10-19 against quebec.ca
    # "Costs related to studying in Québec" (last update 2026-01-01): applications as of 2026-01-01.
    # Corrected from 15,078 / +5,645 per person, which were out of date.
    source_url: "https://www.quebec.ca/en/education/study-quebec/required-conditions/costs-studies"
    effective_from: "2026-01-01"
    verified: true
    rates_by_family_size: {1: 24617, 2: 34814, 3: 42638, 4: 49234, 5: 55045, 6: 60299}
    additional_person_beyond_6_cad: 5254

off_campus_work:
  rule_id: "IRCC-WORK-2024-24HR"
  title: "International Student Off-Campus Work Regulations"
  effective_from: "2024-11-08"
  last_verified: "2026-10-12"
  verified_by: "Checked against the canada.ca work-off-campus page on 2026-10-12"
  source_url: "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/work-off-campus.html"
  statutory_basis: "Immigration and Refugee Protection Regulations (IRPR) Section 186(v)"
  academic_session_max_hours_per_week: 24
  # canada.ca: students can work "unlimited" hours during scheduled breaks
  academic_break_max_hours_per_week: null
