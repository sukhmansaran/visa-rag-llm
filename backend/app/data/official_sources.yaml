# Official source registry (M0.10) — the pages Pendu's knowledge base may be built from.
#
# Hand-curated and reviewed like code: nothing writes to this file. Workflow for a change:
#   1. edit this file
#   2. cd backend; python scripts/verify_registry.py      (every URL: HTTP 200, robots.txt, allowlist, not a soft 404)
#   3. python scripts/sync_sources.py                     (dry run: shows what would change in the sources table)
#   4. python scripts/sync_sources.py --apply             (then ingest new sources as usual)
#
# Fields
#   id            stable key (lowercase-hyphenated); never reuse an id for a different page
#   url           https, on the crawler domain allowlist (app/services/crawler/ssrf_validator.py)
#   tier          1 = IRCC / Government of Canada, 2 = designated learning institution, 3 = recognised org
#   topics        tags from the `topics` list below
#   refresh_days  how often the page is re-fetched (sources.scrape_frequency = refresh_days * 24)
#   max_age_days  older content than this is stale and must not be presented as current
#   priority      1 (highest) to 5; ingestion order
version: 1

topics:
  study_permit: Applying for, holding and keeping a study permit
  pal_tal: Provincial / territorial attestation letters
  proof_of_funds: Financial support requirements for students
  documents: Required documents and how to prepare them
  status_extension: Extending or restoring status, maintained status
  work_while_studying: Working on or off campus during studies
  pgwp: Post-graduation work permit
  visitor_visa: Temporary resident (visitor) visas
  eta: Electronic travel authorization
  biometrics: Fingerprints and photo collection
  express_entry: Express Entry programs, profiles and draws
  language_tests: Approved language tests and CLB/NCLC levels
  fees: Government fees
  processing_times: Application processing times
  university_admissions: Admission requirements published by institutions
  work_permits: Work permits outside study (employer-specific, open, LMIA, NOC/TEER)
  medical_and_police: Medical exams and police certificates
  notices: Official notices of program changes (e.g. a stream closing)

