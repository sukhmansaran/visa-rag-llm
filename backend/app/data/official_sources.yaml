# Pages deliberately not used. sync_sources.py --apply deactivates their sources; chunks already in the
# knowledge base are not touched by sync (removing them is a separate, reviewed step).
excluded:
  - url: https://future.utoronto.ca/apply/international-students/
    reason: >-
      future.utoronto.ca and www.utoronto.ca answer every automated request with HTTP 403 (Pantheon bot
      protection, including robots.txt; checked 2026-10-16). The stored copy is a "Page not found" stub.
      University of Toronto facts come from ircc_rules.yaml instead.
