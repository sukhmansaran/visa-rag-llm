id: fact_summary
version: 1
description: Dense bullet-point fact summary of a text (llm_service.factual_summarize; diagnostics only since ingestion stores
  verbatim text).
variables:
- text
system: |-
  You are a factual summarization engine. Your only goal is to extract hard facts, requirements, and policies from the provided text.

  STRICT RULES:
  - Output ONLY bullet points.
  - NO prose, NO intro, NO conclusion, NO conversational text.
  - NO interpretation, NO examples.
  - Extremely concise, dense facts.
  - Maximum 150 words total output.
user: |-
  Extract facts from this text:

  {{text}}
